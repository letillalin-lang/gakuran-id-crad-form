<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gakuran Academy | Ultimate ID Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; font-family: 'Prompt', sans-serif; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* 3D Card Setup */
        .scene { width: 320px; height: 500px; perspective: 1000px; margin: 0 auto; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border: 2px solid rgba(255,255,255,0.2); background: linear-gradient(135deg, #1a1a1a, #000); box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;}
        .card-back { transform: rotateY(180deg); justify-content: center; }
        
        /* Holographic Overlay */
        .holo::before { content: ''; position: absolute; top: 0; left: 0; width: 200%; height: 200%; background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%); animation: shine 5s infinite; pointer-events: none;}
        @keyframes shine { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        
        input, select, textarea { background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 8px; padding: 10px; color: white; width: 100%; }
        .btn-glow { box-shadow: 0 0 15px currentColor; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10">
        <!-- Form -->
        <div class="glass p-8 rounded-2xl">
            <h1 class="text-3xl font-bold mb-6 text-yellow-500">⚙️ สร้างบัตรนักเรียน</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="name" placeholder="ชื่อ-นามสกุล" oninput="updateCard()">
                <input type="text" id="sid" placeholder="GK-XXXX" maxlength="7" oninput="validateID(this); updateCard()">
                <select id="grade" onchange="updateCard()">
                    <option>ปี 1 (Freshman)</option><option>ปี 2 (Junior)</option><option>ปี 3 (Senior)</option>
                </select>
                <input type="text" id="gang" placeholder="แก๊ง/ชมรม" oninput="updateCard()">
                <input type="text" id="move" placeholder="ท่าไม้ตาย" oninput="updateCard()">
                <input type="url" id="imgUrl" placeholder="ลิงก์รูปภาพโปรไฟล์" oninput="updateCard()">
            </div>
            <div class="mt-4">
                <label>เข็มยศ:</label>
                <select id="badge" onchange="toggleCustomBadge(); updateCard()">
                    <option>🐺 หมาป่าเดียวดาย</option><option>👑 สายเปย์คุมซอย</option><option>⚔️ สายลุยไม่คุยเยอะ</option><option value="custom">กำหนดเอง...</option>
                </select>
                <input type="text" id="customBadge" class="mt-2 hidden" placeholder="พิมพ์เข็มยศของคุณ" oninput="updateCard()">
            </div>
            <div class="grid grid-cols-2 gap-4 mt-4">
                <input type="color" id="colorAccent" value="#FFD700" oninput="updateCard()">
                <input type="color" id="colorBg" value="#000000" oninput="updateCard()">
            </div>
            <textarea id="quote" class="mt-4" placeholder="คำคม..." oninput="updateCard()"></textarea>
            
            <button onclick="downloadCard()" class="w-full mt-6 py-3 bg-gradient-to-r from-yellow-600 to-red-600 rounded-xl font-bold">📥 ดาวน์โหลดบัตร</button>
        </div>

        <!-- Card Preview -->
        <div class="flex flex-col items-center">
            <div class="scene" id="cardContainer">
                <div class="card" id="card" onclick="this.classList.toggle('is-flipped')">
                    <!-- Front -->
                    <div class="card-face holo" id="cardFront">
                        <div class="text-xs uppercase tracking-widest text-gray-400">Gakuran Academy</div>
                        <img id="prevImg" src="https://via.placeholder.com/150" class="w-24 h-24 rounded-full border-4 border-yellow-500 my-2 object-cover">
                        <h2 id="prevName" class="text-xl font-bold">NAME</h2>
                        <div id="prevBadge" class="text-sm bg-black px-3 py-1 rounded-full border border-yellow-500">Badge</div>
                        <p id="prevQuote" class="text-xs italic mt-2 text-center text-gray-300">"..."</p>
                        <div class="mt-4 text-left w-full text-xs">
                            <p>ปี: <span id="prevGrade">...</span></p>
                            <p>แก๊ง: <span id="prevGang">...</span></p>
                            <p>ทักษะ: <span id="prevMove">...</span></p>
                        </div>
                    </div>
                    <!-- Back -->
                    <div class="card-face card-back">
                        <h3 class="text-4xl font-black text-yellow-500" id="prevSidBack">GK-0000</h3>
                        <p class="text-gray-500">Official Student ID</p>
                    </div>
                </div>
            </div>
            <p class="mt-4 text-gray-500 text-sm italic">คลิกที่บัตรเพื่อพลิกดูด้านหลัง</p>
        </div>
    </div>

    <script>
        function validateID(el) {
            let val = el.value.toUpperCase();
            if (!val.startsWith('GK-')) val = 'GK-';
            el.value = val.slice(0, 7);
        }
        function toggleCustomBadge() {
            const b = document.getElementById('badge').value;
            document.getElementById('customBadge').style.display = b === 'custom' ? 'block' : 'none';
        }
        function updateCard() {
            const accent = document.getElementById('colorAccent').value;
            const bg = document.getElementById('colorBg').value;
            
            document.getElementById('prevName').innerText = document.getElementById('name').value || 'NAME';
            document.getElementById('prevSidBack').innerText = document.getElementById('sid').value || 'GK-0000';
            document.getElementById('prevGrade').innerText = document.getElementById('grade').value;
            document.getElementById('prevGang').innerText = document.getElementById('gang').value || '-';
            document.getElementById('prevMove').innerText = document.getElementById('move').value || '-';
            document.getElementById('prevQuote').innerText = `"${document.getElementById('quote').value || '...'}"`;
            document.getElementById('prevImg').src = document.getElementById('imgUrl').value || 'https://via.placeholder.com/150';
            
            const badgeVal = document.getElementById('badge').value;
            document.getElementById('prevBadge').innerText = badgeVal === 'custom' ? document.getElementById('customBadge').value : badgeVal;
            
            document.getElementById('cardFront').style.background = `linear-gradient(135deg, ${bg}, #222)`;
            document.getElementById('cardFront').style.borderColor = accent;
            document.getElementById('prevBadge').style.borderColor = accent;
            document.getElementById('prevBadge').style.color = accent;
        }
        function downloadCard() {
            html2canvas(document.getElementById('cardFront')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-student-id.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
