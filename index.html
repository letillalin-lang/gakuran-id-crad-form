<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gakuran Academy | Student ID Registration</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* ตั้งค่าฟอนต์ */
        body { font-family: 'Prompt', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }

        /* พื้นหลังอวกาศ/เวทมนตร์เคลื่อนไหว */
        .animated-bg {
            background: linear-gradient(-45deg, #050505, #2a0845, #640d14, #001233, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ดีไซน์กระจกใส (Glassmorphism) */
        .glass-panel {
            background: rgba(15, 15, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }

        /* เอฟเฟกต์ตัวหนังสือเรืองแสง */
        .text-glow-gold {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 165, 0, 0.5);
        }
        .text-glow-neon {
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.8), 0 0 15px rgba(0, 255, 255, 0.6);
        }

        /* เอฟเฟกต์ช่องกรอกข้อมูล */
        .glowing-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glowing-input:focus {
            outline: none;
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 10px rgba(138, 43, 226, 0.4);
            transform: scale(1.02);
        }

        /* เอฟเฟกต์การ์ดและโฮโลแกรม */
        .id-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #111, #1a1a2e);
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            transition: all 0.5s ease;
        }
        .id-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* โฮโลแกรมตอน Hover การ์ด */
        .id-card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(5deg);
            box-shadow: 0 20px 40px rgba(255, 0, 127, 0.5), 0 0 30px rgba(0, 255, 255, 0.4);
        }

        /* ตกแต่ง Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 4px; }
    </style>
</head>
<body class="animated-bg text-gray-200 p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 relative z-10">
        
        <!-- ================= ซ้าย: แบบฟอร์มกรอกข้อมูล ================= -->
        <div class="lg:col-span-7 glass-panel rounded-2xl p-6 md:p-10 relative overflow-hidden">
            <!-- ของตกแต่งมุม -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-pink-600 rounded-full mix-blend-screen filter blur-[60px] opacity-50"></div>
            <div class="absolute bottom-0 left-0 w-32 h-32 bg-blue-600 rounded-full mix-blend-screen filter blur-[60px] opacity-50"></div>

            <div class="text-center mb-8">
                <h1 class="font-cinzel text-4xl md:text-5xl font-bold text-yellow-400 text-glow-gold mb-2">GAKURAN ACADEMY</h1>
                <p class="text-pink-400 font-light tracking-[0.2em] text-glow-neon">STUDENT ID REGISTRATION SYSTEM</p>
            </div>

            <form id="idForm" class="space-y-5 relative z-10" action="https://formspree.io/f/mqpzqlpy" method="POST">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- ชื่อ -->
                    <div>
                        <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-user-ninja mr-2"></i>ชื่อ-นามสกุล / ฉายา</label>
                        <input type="text" id="inpName" name="Name" class="w-full glowing-input rounded-lg p-3" placeholder="เช่น หมาป่ารัตติกาล..." required>
                    </div>
                    <!-- รหัสนักเรียน -->
                    <div>
                        <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-hashtag mr-2"></i>รหัสนักเรียน (4 หลัก)</label>
                        <input type="text" id="inpId" name="StudentID" class="w-full glowing-input rounded-lg p-3" placeholder="GK-9901" maxlength="7" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- ชั้นปี -->
                    <div>
                        <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-graduation-cap mr-2"></i>ชั้นปี</label>
                        <select id="inpYear" name="Year" class="w-full glowing-input rounded-lg p-3">
                            <option value="ปี 1 (Freshman)">ปี 1 (Freshman)</option>
                            <option value="ปี 2 (Junior)">ปี 2 (Junior)</option>
                            <option value="ปี 3 (Senior)">ปี 3 (Senior)</option>
                        </select>
                    </div>
                    <!-- สังกัดแก๊ง -->
                    <div>
                        <label class="block text-sm text-yellow-300 mb-1"><i class="fa-brands fa-fort-awesome mr-2"></i>สังกัดแก๊ง/ชมรม</label>
                        <input type="text" id="inpGang" name="Gang" class="w-full glowing-input rounded-lg p-3" placeholder="ใส่ชื่อแก๊ง หรือ ไร้สังกัด">
                    </div>
                </div>

                <!-- อาวุธ & พลัง -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 items-end">
                    <div class="md:col-span-2">
                        <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-khanda mr-2"></i>สไตล์การต่อสู้ / ท่าไม้ตาย</label>
                        <input type="text" id="inpMove" name="SignatureMove" class="w-full glowing-input rounded-lg p-3" placeholder="เช่น เพลงดาบล่องนภา ขั้นสุดยอด">
                    </div>
                    <div>
                        <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-fire mr-2"></i>สีออร่า (Aura)</label>
                        <input type="color" id="inpColor" name="AuraColor" value="#ff007f" class="w-full h-[50px] rounded-lg cursor-pointer bg-black/50 border border-gray-600 p-1">
                    </div>
                </div>

                <!-- เข็มยศ -->
                <div>
                    <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-medal mr-2"></i>เลือกเข็มยศประจำตัว</label>
                    <select id="inpBadge" name="Badge" class="w-full glowing-input rounded-lg p-3 text-lg">
                        <option value="🐺 หมาป่าเดียวดาย">🐺 หมาป่าเดียวดาย (Solo Player)</option>
                        <option value="👑 สายเปย์คุมซอย">👑 สายเปย์คุมซอย (Rich & Powerful)</option>
                        <option value="⚔️ สายลุยไม่คุยเยอะ">⚔️ สายลุยไม่คุยเยอะ (Aggressive)</option>
                        <option value="☕ นักนอนหลังห้อง">☕ นักนอนหลังห้อง (Lazy Master)</option>
                    </select>
                </div>

                <!-- ลิงก์รูปภาพ -->
                <div>
                    <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-image mr-2"></i>ลิงก์รูปภาพโปรไฟล์ (URL)</label>
                    <input type="url" id="inpImg" name="AvatarURL" class="w-full glowing-input rounded-lg p-3" placeholder="วางลิงก์รูปภาพของคุณที่นี่ (ลงท้ายด้วย .png หรือ .jpg)">
                </div>

                <!-- คำคม -->
                <div>
                    <label class="block text-sm text-yellow-300 mb-1"><i class="fa-solid fa-quote-left mr-2"></i>คำคมประจำตัว</label>
                    <textarea id="inpQuote" name="Quote" rows="2" class="w-full glowing-input rounded-lg p-3" placeholder="พิมพ์คำคมเท่ๆ ของคุณ..."></textarea>
                </div>

                <!-- ปุ่ม Submit -->
                <button type="submit" id="submitBtn" class="w-full mt-6 bg-gradient-to-r from-pink-600 via-purple-600 to-blue-600 hover:from-pink-500 hover:to-blue-500 text-white font-bold text-xl py-4 rounded-xl shadow-[0_0_20px_rgba(255,0,255,0.5)] transform transition hover:scale-105 border border-white/20 uppercase font-cinzel tracking-widest">
                    <i class="fa-solid fa-bolt mr-2"></i> Register ID Card
                </button>
            </form>
        </div>

        <!-- ================= ขวา: พรีวิวบัตร (Real-time) ================= -->
        <div class="lg:col-span-5 flex items-center justify-center perspective-1000">
            <!-- บัตรนักเรียน -->
            <div id="cardPreview" class="id-card w-full max-w-sm rounded-2xl p-6 text-white flex flex-col items-center">
                
                <!-- หัวบัตร -->
                <div class="w-full text-center border-b border-yellow-500/50 pb-3 mb-4">
                    <h2 class="font-cinzel font-bold text-2xl text-yellow-400 tracking-wider">GAKURAN</h2>
                    <p class="text-[10px] text-gray-400 tracking-[0.3em] uppercase">Student Identification</p>
                </div>

                <!-- รูปโปรไฟล์ -->
                <div class="relative w-32 h-32 mb-4">
                    <div id="cardAura" class="absolute inset-0 rounded-full bg-pink-500 blur-md opacity-70 animate-pulse"></div>
                    <img id="cardImg" src="https://i.pinimg.com/736x/8f/c9/29/8fc9296e625c1a79bd3872bb23c914e6.jpg" alt="Profile" class="relative z-10 w-full h-full object-cover rounded-full border-2 border-yellow-400 shadow-[0_0_15px_rgba(255,215,0,0.5)]">
                </div>

                <!-- ข้อมูลบัตร -->
                <div class="w-full space-y-2 text-center relative z-10">
                    <h3 id="cardName" class="text-2xl font-bold text-white text-glow-neon">ชื่อของคุณ</h3>
                    <p id="cardId" class="text-sm font-cinzel text-yellow-300 bg-black/40 inline-block px-3 py-1 rounded-full border border-yellow-500/30">GK-XXXX</p>
                    
                    <div class="grid grid-cols-2 gap-2 mt-4 text-xs text-left bg-black/40 p-3 rounded-lg border border-gray-700">
                        <div class="text-gray-400">CLASS: <br><span id="cardYear" class="text-white font-semibold">ปี 1 (Freshman)</span></div>
                        <div class="text-gray-400">FACTION: <br><span id="cardGang" class="text-pink-400 font-semibold">ไร้สังกัด</span></div>
                        <div class="col-span-2 text-gray-400 mt-1">STYLE / MOVE: <br><span id="cardMove" class="text-blue-300 font-semibold">-</span></div>
                    </div>

                    <div id="cardBadge" class="mt-4 text-xl bg-gradient-to-r from-gray-800 to-gray-900 py-2 rounded-lg border border-gray-600 shadow-inner">
                        🐺 หมาป่าเดียวดาย
                    </div>

                    <div class="mt-4 italic text-sm text-gray-400 px-4">
                        "<span id="cardQuote">วินัยคือหัวใจของความสำเร็จ</span>"
                    </div>
                </div>
                
                <!-- โลโก้ลายนํ้า -->
                <i class="fa-brands fa-d-and-d absolute bottom-[-20px] right-[-20px] text-9xl text-white/5 z-0 rotate-12"></i>
            </div>
        </div>

    </div>

    <!-- Script สำหรับทำ Real-time Preview และเอฟเฟกต์ -->
    <script>
        // ดึง Element ฟอร์ม
        const inputs = {
            name: document.getElementById('inpName'),
            id: document.getElementById('inpId'),
            year: document.getElementById('inpYear'),
            gang: document.getElementById('inpGang'),
            move: document.getElementById('inpMove'),
            color: document.getElementById('inpColor'),
            badge: document.getElementById('inpBadge'),
            img: document.getElementById('inpImg'),
            quote: document.getElementById('inpQuote')
        };

        // ดึง Element บัตร
        const cards = {
            name: document.getElementById('cardName'),
            id: document.getElementById('cardId'),
            year: document.getElementById('cardYear'),
            gang: document.getElementById('cardGang'),
            move: document.getElementById('cardMove'),
            aura: document.getElementById('cardAura'),
            badge: document.getElementById('cardBadge'),
            img: document.getElementById('cardImg'),
            quote: document.getElementById('cardQuote'),
            mainCard: document.getElementById('cardPreview')
        };

        // ฟังก์ชันอัปเดตข้อมูลแบบ Real-time
        function updateCard() {
            cards.name.innerText = inputs.name.value || 'ชื่อของคุณ';
            cards.id.innerText = inputs.id.value || 'GK-XXXX';
            cards.year.innerText = inputs.year.value;
            cards.gang.innerText = inputs.gang.value || 'ไร้สังกัด';
            cards.move.innerText = inputs.move.value || '-';
            cards.badge.innerText = inputs.badge.value;
            cards.quote.innerText = inputs.quote.value || 'วินัยคือหัวใจของความสำเร็จ';
            
            // อัปเดตสีออร่า (Aura Color)
            const color = inputs.color.value;
            cards.aura.style.backgroundColor = color;
            cards.mainCard.style.boxShadow = `0 0 20px ${color}80`; // ให้ขอบบัตรเรืองแสงตามสีออร่าด้วย
            cards.name.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`;

            // อัปเดตรูป
            if(inputs.img.value.match(/\.(jpeg|jpg|gif|png)$/) != null) {
                cards.img.src = inputs.img.value;
            }
        }

        // ใส่ Event Listener ให้ทุกช่อง
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateCard);
        });

        // เอฟเฟกต์ตอนกดปุ่ม Submit (พลุกระดาษสีทอง-ชมพู-ม่วง)
        document.getElementById('idForm').addEventListener('submit', function(e) {
            // ปล่อยให้ฟอร์มทำงานปกติ (ส่งไป Formspree) แต่เพิ่มเอฟเฟกต์ก่อนหน้าเว็บจะเปลี่ยน
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff007f', '#ffd700', '#8a2be2']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#00ffff', '#ffd700', '#ff007f']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>
</html>
