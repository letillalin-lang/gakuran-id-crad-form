<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gakuran Student ID Card Generator</title>
    <style>
        /* --- 1. การตั้งค่าระบบและการออกแบบพื้นฐาน --- */
        :root {
            --primary-color: #0d1117;
            --accent-color: #ffd700; /* สีทองกาคุรัน */
            --text-color: #ffffff;
            --card-glow: rgba(255, 215, 0, 0.3);
        }

        body {
            background: radial-gradient(circle at center, #1a1c23 0%, #0a0b0e 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            perspective: 1000px; /* สร้างมิติ 3D สำหรับตัวการ์ด */
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: center;
            max-width: 1100px;
        }

        /* --- 2. ความอลังการของตัวการ์ด (The Card) --- */
        .card-container {
            position: relative;
            width: 380px;
            height: 580px;
            transition: transform 0.1s ease;
            transform-style: preserve-3d;
        }

        .id-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #141722 0%, #0b0c10 100%);
            border: 3px solid var(--accent-color);
            border-radius: 16px;
            box-shadow: 0 0 30px var(--card-glow), inset 0 0 20px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
            transform: translateZ(50px); /* ดันเนื้อหาลอยขึ้นมาในมิติ 3D */
        }

        /* เอฟเฟกต์โฮโลแกรม / สะท้อนแสงเงา */
        .id-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(105deg, 
                rgba(255,255,255,0) 30%, 
                rgba(255,255,255,0.13) 40%, 
                rgba(255,215,0,0.1) 50%, 
                rgba(255,255,255,0.13) 60%, 
                rgba(255,255,255,0) 70%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            transition: background-position 0.5s ease;
            pointer-events: none;
            z-index: 5;
        }

        .card-container:hover .id-card::before {
            background-position: 150% 0%;
        }

        /* หัวบัตรและตราโรงเรียน */
        .card-header {
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 2px dashed rgba(255,215,0,0.3);
            padding-bottom: 10px;
        }

        .school-badge {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
            letter-spacing: 3px;
        }

        .school-name {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* กรอบรูปอนิเมะ/ผู้ใช้งาน (สไตล์กระดุมทองกาคุรัน) */
        .photo-frame {
            width: 180px;
            height: 220px;
            border: 2px solid var(--accent-color);
            background: #090a0f;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* รายละเอียดข้อมูลในบัตร */
        .card-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
        }

        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* ดีเทลความเท่: บาร์โค้ด และแถบพลัง */
        .card-footer {
            margin-top: auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0.7;
            font-size: 10px;
        }

        .barcode {
            font-family: monospace;
            letter-spacing: 4px;
            font-size: 14px;
        }

        /* --- 3. แผงควบคุมสำหรับให้คนอื่นมาปรับแต่ง (Control Panel) --- */
        .control-panel {
            background: rgba(20, 23, 34, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .control-panel h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 12px;
            opacity: 0.8;
        }

        .input-group input, .input-group select {
            background: #141722;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .btn-download {
            width: 100%;
            background: linear-gradient(90deg, #ffd700, #ffa500);
            border: none;
            padding: 12px;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-download:hover {
            transform: scale(1.03);
        }
    </style>
    <!-- นำเข้า html2canvas เพื่อใช้ในการดาวน์โหลดการ์ดเป็นรูปภาพ -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h1 style="text-align:center; color:#fff; font-size: 24px; margin-bottom: 30px; letter-spacing: 1px;">⚙️ GAKURAN ID CARD CUSTOMIZER</h1>

    <div class="container">
        <!-- [ฝั่งซ้าย] ตัวการ์ดอลังการ 3D -->
        <div class="card-container" id="cardContainer">
            <div class="id-card" id="idCard">
                <div class="card-header">
                    <div class="school-badge" id="textBadge">学</div>
                    <div class="school-name" id="textSchool">Karasuno High School</div>
                </div>
                
                <div class="photo-frame">
                    <img id="avatarPreview" src="https://placeholder.com" alt="Student Photo">
                </div>

                <div class="card-body">
                    <div class="info-group">
                        <span class="info-label">Student Name</span>
                        <span class="info-value" id="textName">Hinata Shoyo</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Class / Section</span>
                        <span class="info-value" id="textClass">Class 1-1 / No.10</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Status / Role</span>
                        <span class="info-value" id="textRole">Middle Blocker</span>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="barcode">||||| | |||| || | ||</div>
                    <div id="textId">ID: 2026-0010</div>
                </div>
            </div>
        </div>

        <!-- [ฝั่งขวา] แผงควบคุมการปรับแต่ง -->
        <div class="control-panel">
            <h2>Customize Card</h2>
            
            <div class="input-group">
                <label>รูปภาพนักเรียน</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="input-group">
                <label>ตราโรงเรียน (คันจิ/ไอคอน)</label>
                <input type="text" id="inputBadge" value="学" maxlength="2">
            </div>

            <div class="input-group">
                <label>ชื่อโรงเรียน</label>
                <input type="text" id="inputSchool" value="Karasuno High School">
            </div>

            <div class="input-group">
                <label>ชื่อ-นามสกุล</label>
                <input type="text" id="inputName" value="Hinata Shoyo">
            </div>

            <div class="input-group">
                <label>ชั้นเรียน / เลขที่</label>
                <input type="text" id="inputClass" value="Class 1-1 / No.10">
            </div>

            <div class="input-group">
                <label>ตำแหน่ง / ฉายา</label>
                <input type="text" id="inputRole" value="Middle Blocker">
            </div>
